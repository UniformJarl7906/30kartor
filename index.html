<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>30KARTOR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="30KARTOR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2046">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--t:#111;--g:rgba(255,255,255,.55);--b:rgba(255,255,255,.65)}
@media(prefers-color-scheme:dark){:root{--t:#fff;--g:rgba(20,32,58,.55);--b:rgba(255,255,255,.18)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,system-ui,sans-serif;color:var(--t);overflow:hidden}
#map{position:absolute;inset:0;z-index:0}
.g{background:var(--g);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--b);box-shadow:0 8px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5);border-radius:24px;color:var(--t)}
#top,#ban,#fart,#inf,#ctr,#vol{position:absolute;z-index:1000}
#top{top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px}
#sok{display:flex;align-items:center}
#q{flex:1;min-width:0;border:0;background:none;font-size:17px;padding:14px 16px;color:var(--t);outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#sok button{padding:12px 13px;font-size:17px}
#res{display:none;margin-top:8px;max-height:44vh;overflow:auto}
#res div{padding:12px 16px;font-size:15px;border-bottom:1px solid var(--b)}
#ban{display:none;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;padding:16px;font-size:22px;font-weight:700;background:rgba(30,107,255,.85);color:#fff}
body.nav #top{display:none}body.nav #ban{display:block}
#fart{left:12px;bottom:calc(env(safe-area-inset-bottom) + 110px);padding:10px 14px;display:flex;flex-direction:column}
#kmh{font-size:26px}#kmh.r{color:#e22}#fart small{opacity:.7;font-size:12px}
#ctr,#vol{right:12px;width:52px;height:52px;border-radius:26px;font-size:24px;color:#1e6bff}
#ctr{bottom:calc(env(safe-area-inset-bottom) + 110px)}
#vol{bottom:calc(env(safe-area-inset-bottom) + 172px);font-size:20px}
#inf{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);padding:14px 16px;display:flex;align-items:center;gap:12px}
#txt{flex:1;font-size:16px}
#go{display:none;background:#1e8e3e;color:#fff;font-weight:700;padding:12px 18px;border-radius:20px;font-size:17px}
#go.s{background:#d11}
.pil{width:34px;height:34px;border-radius:17px;background:#1e6bff;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:#e22;border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
</style></head><body>
<div id="map"></div>
<div id="top"><div id="sok" class="g"><input id="q" placeholder="Sök adress eller plats" autocomplete="off" autocorrect="off"><button id="x">✕</button><button id="cfg">⚙</button></div><div id="res" class="g"></div></div>
<div id="ban" class="g"></div>
<div id="fart" class="g"><b id="kmh">0 km/h</b><small>Max 30</small><small id="gps">GPS ...</small></div>
<button id="vol" class="g">🔊</button><button id="ctr" class="g">◎</button>
<div id="inf" class="g"><span id="txt">Sök en adress, eller håll fingret nere på kartan</span><button id="go">Starta rutt</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s),MAX=30;
const SV={0:'Sväng vänster',1:'Sväng höger',2:'Skarp sväng vänster',3:'Skarp sväng höger',4:'Sväng svagt vänster',5:'Sväng svagt höger',6:'Fortsätt rakt fram',7:'Kör in i rondellen',8:'Lämna rondellen',9:'Vänd',10:'Du är framme',11:'Starta',12:'Håll till vänster',13:'Håll till höger'};
let pos=null,mal=null,rutt=[],steg=[],idx=0,navig=false,folj=true,mute=false,lastRe=0,said={},first=true,line,gap,mk,me,acc,wl,sokT;
const map=L.map('map',{zoomControl:false}).setView([56.67,12.86],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const m=(a,b)=>{const r=Math.PI/180,R=6371000,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const s=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(s))};
const len=(a,b)=>{let s=0;for(let i=a;i<b&&i<rutt.length-1;i++)s+=m(rutt[i],rutt[i+1]);return s};
const dist=x=>x>=1000?(x/1000).toFixed(1)+' km':Math.max(10,Math.round(x/10)*10)+' m';
const tid=x=>{x=Math.max(1,Math.round(x));return x<60?x+' min':Math.floor(x/60)+' h'+(x%60?' '+x%60+' min':'')};
const say=t=>$('#txt').textContent=t;
function key(){let k='';try{k=localStorage.getItem('k')||''}catch(e){}if(!k){k=(prompt('Klistra in din nyckel från account.heigit.org')||'').trim();try{if(k)localStorage.setItem('k',k)}catch(e){}}return k}
function speak(t){if(mute||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';speechSynthesis.cancel();speechSynthesis.speak(u)}
async function wake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function etikett(p){let r=p.name||'';if(p.street){const g=p.street+(p.housenumber?' '+p.housenumber:'');r=p.name&&p.name!==p.street?p.name+', '+g:g}const o=p.city||p.locality||p.district||p.county||'';return [r,o&&o!==r?o:''].filter(Boolean).join(', ')}
navigator.geolocation.watchPosition(p=>{const c=p.coords;pos={lat:c.latitude,lng:c.longitude};const ll=[pos.lat,pos.lng];
if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="pil" id="pil">▲</div>',iconSize:[34,34]})}).addTo(map);acc=L.circle(ll,{radius:c.accuracy,weight:1,color:'#1e6bff',fillOpacity:.1}).addTo(map)}
me.setLatLng(ll);acc.setLatLng(ll).setRadius(c.accuracy);
if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)$('#pil').style.transform='rotate('+c.heading+'deg)';
const k=c.speed>0?Math.round(c.speed*3.6):0;$('#kmh').textContent=k+' km/h';$('#kmh').className=k>MAX?'r':'';$('#gps').textContent='GPS ±'+Math.round(c.accuracy)+' m';
if(first){map.setView(ll,16);first=false}if(navig)tick()},e=>say('Kan inte hämta positionen. Tillåt plats för sidan.'),{enableHighAccuracy:true,maximumAge:0,timeout:20000});
$('#q').oninput=()=>{clearTimeout(sokT);const t=$('#q').value.trim();if(t.length<3){$('#res').style.display='none';return}sokT=setTimeout(()=>sok(t),350)};
async function sok(t){try{let u='https://photon.komoot.io/api/?q='+encodeURIComponent(t)+'&limit=8&bbox=10.9,55.3,24.2,69.1';if(pos)u+='&lat='+pos.lat+'&lon='+pos.lng;const d=await(await fetch(u)).json(),seen={},l=[];
(d.features||[]).forEach(f=>{const p=f.properties;if(p.countrycode&&p.countrycode!=='SE')return;const n=etikett(p);if(!n||seen[n])return;seen[n]=1;l.push({n,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]})});
const r=$('#res');r.innerHTML='';l.slice(0,6).forEach(x=>{const b=document.createElement('div');b.textContent=x.n;b.onclick=()=>{$('#q').value=x.n;r.style.display='none';$('#q').blur();rutten({lat:x.lat,lng:x.lng})};r.appendChild(b)});r.style.display=l.length?'block':'none'}catch(e){}}
$('#x').onclick=()=>{$('#q').value='';$('#res').style.display='none';mal=null;rutt=[];steg=[];[line,gap,mk].forEach(x=>x&&x.remove());stop();$('#go').style.display='none';say('Sök en adress, eller håll fingret nere på kartan')};
$('#cfg').onclick=()=>{const k=prompt('Klistra in din nyckel från account.heigit.org');if(k!==null){try{localStorage.setItem('k',k.trim())}catch(e){}}};
$('#vol').onclick=()=>{mute=!mute;$('#vol').textContent=mute?'🔇':'🔊';if(mute&&window.speechSynthesis)speechSynthesis.cancel()};
map.on('contextmenu',e=>{if(!navig){$('#q').value='';rutten({lat:e.latlng.lat,lng:e.latlng.lng})}});
map.on('dragstart',()=>{if(navig)folj=false});
$('#ctr').onclick=()=>{if(!pos)return;if(navig){folj=true;map.setView([pos.lat,pos.lng],17)}else map.setView([pos.lat,pos.lng],17)};
async function rutten(s,omr){if(!pos){say('Väntar på GPS-position...');return}const k=key();if(!k){say('Nyckel saknas. Tryck på ⚙.');return}
mal=s;if(mk)mk.remove();mk=L.marker([s.lat,s.lng],{draggable:true,icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,22]})}).addTo(map).on('dragend',()=>{const p=mk.getLatLng();rutten({lat:p.lat,lng:p.lng})});
if(!omr){rutt=[];steg=[];stop();say('Räknar ut rutt...')}
try{const r=await fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson',{method:'POST',headers:{Authorization:k,'Content-Type':'application/json'},body:JSON.stringify({coordinates:[[pos.lng,pos.lat],[s.lng,s.lat]],radiuses:[500,1500],options:{avoid_features:['highways','tollways']}})});
const d=await r.json(),f=d.features&&d.features[0];if(!f){say(r.status==401||r.status==403?'Nyckeln godkändes inte. Byt den med ⚙.':'Ingen rutt hittades.');return}
rutt=f.geometry.coordinates.map(c=>[c[1],c[0]]);steg=[];(f.properties.segments||[]).forEach(g=>steg=steg.concat(g.steps||[]));idx=0;
[line,gap].forEach(x=>x&&x.remove());line=L.polyline(rutt,{color:'#1e6bff',weight:6}).addTo(map);
const e=rutt[rutt.length-1],kvar=Math.round(m(e,[s.lat,s.lng]));if(kvar>30)gap=L.polyline([e,[s.lat,s.lng]],{color:'#888',weight:3,dashArray:'6 8'}).addTo(map);
const km=f.properties.summary.distance/1000;$('#go').style.display='block';
if(omr){say('Ny rutt beräknad.')}else{say(km.toFixed(1)+' km, ca '+tid(km/MAX*60)+(kvar>30?'. Vägen slutar ca '+kvar+' m från målet.':''));map.fitBounds(L.latLngBounds(rutt.concat([[s.lat,s.lng]])),{paddingTopLeft:[30,110],paddingBottomRight:[30,210]})}}catch(e){say('Kunde inte hämta rutt.')}}
function tick(){if(!navig||!rutt.length||!pos)return;const p=[pos.lat,pos.lng];let b=idx,bd=1e9;for(let i=idx;i<Math.min(rutt.length,idx+300);i++){const d=m(rutt[i],p);if(d<bd){bd=d;b=i}}
if(bd>60){if(Date.now()-lastRe>8000){lastRe=Date.now();rutten(mal,true)}}else idx=b;
if(m(p,[mal.lat,mal.lng])<40||(idx>=rutt.length-3&&bd<40)){stop();say('Du är framme!');speak('Du är framme');return}
const n=steg.find(t=>t.way_points[0]>idx),kv=len(idx,rutt.length-1);let tx='Fortsätt till målet';
if(n){const till=len(idx,n.way_points[0]),ty=SV[n.type]||'Fortsätt';tx='Om '+dist(till)+'<br>'+ty+(n.name&&n.name!=='-'?' på '+n.name:'');if(till<250&&!said[n.way_points[0]]){said[n.way_points[0]]=1;speak('Om '+Math.round(till/10)*10+' meter, '+ty)}}
$('#ban').innerHTML=tx;say(dist(kv)+' kvar, ca '+tid(kv/1000/MAX*60));line.setLatLngs([p].concat(rutt.slice(idx+1)));if(folj)map.panTo(p)}
$('#go').onclick=()=>{if(navig){stop();if(rutt.length)map.fitBounds(L.latLngBounds(rutt),{paddingTopLeft:[30,110],paddingBottomRight:[30,210]});return}
navig=true;folj=true;idx=0;said={};document.body.classList.add('nav');$('#go').textContent='Avsluta';$('#go').className='s';wake();speak('Rutten startar');map.setView([pos.lat,pos.lng],17);tick()};
function stop(){navig=false;document.body.classList.remove('nav');$('#go').textContent='Starta rutt';$('#go').className='';if(wl){wl.release();wl=null}if(window.speechSynthesis)speechSynthesis.cancel();if(line&&rutt.length)line.setLatLngs(rutt)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
